<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1d2671, #c33764);
            height: 100vh;
            color: white;
        }

        h1 {
            text-align: center;
            padding: 20px;
            font-weight: 600;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .glass {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        input {
            padding: 10px;
            margin: 5px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.2);
            color: white;
        }

        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: #00c6ff;
            color: black;
            font-weight: bold;
            transition: 0.3s;
        }

        input::placeholder {
            color: #ddd;
        }

        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            background: #00c6ff;
            color: black;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            background: #00e1ff;
        }

        .toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            color: black;
        }

        .expense {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
        }

        .delete {
            background: rgba(255, 0, 0, 0.7);
            color: white;
        }

        .delete:hover {
            background: red;
        }

        .summary-item {
            padding: 10px;
            margin: 5px 0;
            border-radius: 10px;
            background: rgba(0,255,255,0.15);
        }
    </style>
</head>

<body>

<button class="toggle" onclick="toggleMode()">🌙 / ☀️</button>

<h1>💎 Expense Tracker</h1>

<div class="container">

    <div class="glass">
        <h3>Add Expense</h3>
        <input id="title" placeholder="Title">
        <input id="amount" type="number" placeholder="Amount">
        <input id="category" placeholder="Category">
        <button onclick="addExpense()">Add</button>
    </div>

    <div class="glass">
        <h3>Expenses</h3>
        <div id="list"></div>
    </div>

    <div class="glass">
        <h3>Summary</h3>
        <div id="summary"></div>
    </div>

</div>

<script>
const API = "http://localhost:8080/expenses";

async function loadExpenses() {
    const res = await fetch(API);
    const data = await res.json();

    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(e => {
        const div = document.createElement("div");
        div.className = "expense";

        div.innerHTML = `
            <span>${e.title} - ₹${e.amount} (${e.category})</span>
            <button class="delete" onclick="deleteExpense(${e.id})">Delete</button>
        `;

        list.appendChild(div);
    });
}

async function addExpense() {
    const title = document.getElementById("title").value;
    const amount = document.getElementById("amount").value;
    const category = document.getElementById("category").value;

    await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, amount, category })
    });

    loadExpenses();
    loadSummary();
}

async function deleteExpense(id) {
    await fetch(`${API}/${id}`, { method: "DELETE" });
    loadExpenses();
    loadSummary();
}

async function loadSummary() {
    const res = await fetch(`${API}/summary`);
    const data = await res.json();

    const summary = document.getElementById("summary");
    summary.innerHTML = "";

    data.forEach(s => {
        const div = document.createElement("div");
        div.className = "summary-item";
        div.innerText = `${s.category}: ₹${s.total}`;
        summary.appendChild(div);
    });
}

loadExpenses();
loadSummary();
</script>

</body>
</html>
